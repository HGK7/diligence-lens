# Diligence Lens — app + server Qdrant (host Ollama for embeds)
#
# Prerequisites: host Ollama + nomic-embed-text; .env with GEMINI_API_KEY;
# host ./dataroom exported (e.g. python scripts/export_cuad.py --limit 80 --replace).
#
#   docker compose up --build
#   → http://localhost:8501  → Build or rebuild index (path DB does not migrate)
#
# Full path: docs/DOCKER.md · local-first happy path: README.md

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  diligence-lens:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Server Qdrant (avoids path-mode >20k warning / lock fights)
      QDRANT_URL: http://qdrant:6333
      # Host Ollama (Windows/Mac Docker Desktop)
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./dataroom:/app/dataroom:ro
      - ./audit:/app/audit
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional: Ollama inside Compose (needs NVIDIA Container Toolkit on Linux).
  # On Windows laptops, prefer host Ollama + host.docker.internal above.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  qdrant_storage:
