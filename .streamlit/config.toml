[server]
headless = true
# Path-mode Qdrant is single-process; one Streamlit per data/qdrant is enough.
# Prefer a full restart over fighting locks if Recover index connection fails.
#
# Disable module path watching: Streamlit's LocalSourcesWatcher probes every
# imported package. sentence_transformers -> transformers lazy-loads dozens of
# vision processors that import torchvision (not needed for CrossEncoder) and
# floods the terminal with ModuleNotFoundError noise. Manual restart is fine.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4b3a"
backgroundColor = "#f7f6f2"
secondaryBackgroundColor = "#ebe8e1"
textColor = "#1c1c1c"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#e4e0d7"
